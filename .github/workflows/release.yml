name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: tex2ss-linux-x86_64
          - os: windows-latest
            artifact: tex2ss-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.10.3
          cabal-version: 3.16.1.0
      - run: cabal update
      - run: cabal build exe:tex2ss
      - name: Check release boundary
        shell: pwsh
        run: ./scripts/check-release.ps1
      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="${{ matrix.artifact }}"
          mkdir "$package"
          cp "$(cabal list-bin exe:tex2ss)" "$package/tex2ss"
          cp LICENSE README.md "$package/"
          tar -czf "$package.tar.gz" "$package"
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "${{ matrix.artifact }}"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item (cabal list-bin exe:tex2ss) (Join-Path $package tex2ss.exe)
          Copy-Item LICENSE,README.md $package
          Compress-Archive -Path $package -DestinationPath "$package.zip"
          $hash = (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content "$package.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
          if-no-files-found: ignore

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
